
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل صوت الطالب</title>
<style>
body {
  font-family: Arial;
  background: #f2f5fa;
  text-align: center;
  padding: 25px;
}
.card {
  background: white;
  max-width: 440px;
  margin: 30px auto;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 4px 20px #0001;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 14px 24px;
  margin: 8px;
  font-size: 17px;
  cursor: pointer;
}
#start {background:#1769aa;color:white}
#stop {background:#d93645;color:white}
#status {margin:20px}
</style>
</head>
<body>
<div class="card">
<h2>تسجيل صوت الطالب</h2>
<p>اضغط على الزر وسجل إجابتك الصوتية.</p>
<button id="start">🎙️ بدء التسجيل</button>
<button id="stop" disabled>إيقاف التسجيل</button>
<p id="status">جاهز للتسجيل</p>
<audio id="player" controls style="width:100%"></audio>
</div>

<script>
let recorder;
let stream;
let chunks = [];

const start = document.getElementById("start");
const stop = document.getElementById("stop");
const status = document.getElementById("status");
const player = document.getElementById("player");

start.onclick = async () => {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("MIC_UNAVAILABLE");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    const types = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4"
    ];

    const mime = types.find(t => MediaRecorder.isTypeSupported(t));
    recorder = new MediaRecorder(stream, mime ? {mimeType:mime} : {});

    chunks = [];
    recorder.ondataavailable = e => {
      if (e.data.size) chunks.push(e.data);
    };

    recorder.onstop = () => {
      const blob = new Blob(chunks, {type:recorder.mimeType});
      player.src = URL.createObjectURL(blob);
      status.textContent = "تم التسجيل بنجاح. استمع إلى صوتك.";
      stream.getTracks().forEach(t => t.stop());
    };

    recorder.start();
    status.textContent = "جاري التسجيل...";
    start.disabled = true;
    stop.disabled = false;

  } catch (e) {
    status.textContent =
      e.message === "MIC_UNAVAILABLE"
      ? "المتصفح لا يدعم التسجيل في هذه الصفحة."
      : "تعذر الوصول للميكروفون. افحص الأذونات.";
  }
};

stop.onclick = () => {
  if (recorder?.state === "recording") {
    recorder.stop();
    start.disabled = false;
    stop.disabled = true;
  }
};
</script>
</body>
</html>
